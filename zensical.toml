[project]
site_name = "TXTControl"
site_description = "A Pythonic, asyncio-based ftrobopy implementation for the Fischertechnik TXT Controller"
site_author = "Franz Weingartz"
site_url = "https://scaui.dev/txtcontrol"
site_dir = "site"
copyright = """
Copyright &copy; 2025 Franz Weingartz
"""
docs_dir = "docs"

nav = [
    "index.md",
    "examples.md",
    "api.md"
]

[project.theme]
#favicon = "images/favicon.png"

#extra_css = ["stylesheets/extra.css"]
#extra_javascript = ["javascripts/extra.js"]

language = "en"

features = [
    "announce.dismiss",
    #"content.action.edit",
    #"content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    #"header.autohide",
    #"navigation.expand",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    #"navigation.instant.progress",
    "navigation.path",
    #"navigation.prune",
    "navigation.sections",
    #"navigation.tabs",
    #"navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    #"toc.follow",
    #"toc.integrate",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep purple"
accent = "purple"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep purple"
accent = "purple"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_root_toc_entry = false
inherited_members = true
show_source = false
#merge_init_into_class = true

